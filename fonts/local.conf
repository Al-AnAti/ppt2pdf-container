<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fallbacks for Microsoft Office fonts that have no metric-compatible free
  clone. Arial, Times New Roman, Courier New, Calibri, Cambria, Palatino,
  Bookman and friends are already mapped to Liberation, Carlito, Caladea and
  URW base35 by fontconfig's own 30-metric-aliases.conf; this file covers the
  rest so LibreOffice picks a sensible face instead of its last-resort default.
-->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Franklin Gothic</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Lucida Console</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Cascadia Code</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
</fontconfig>
